<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet Map</title>

    <!-- Leaflet CSS (same as your original) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      /* make Leaflet controls look nice above React UI */
      .leaflet-top.leaflet-left { z-index: 1000; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Leaflet JS (global L, just like your original files) -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Proj4 + Proj4Leaflet (kept for parity with your setup) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.1/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.js"></script>

    <!-- GeoPackage (browser build) -->
    <script src="https://unpkg.com/@ngageoint/geopackage/dist/geopackage.min.js"></script>

    <!-- FlatGeobuf (browser build) -->
    <script src="https://unpkg.com/flatgeobuf@3.22.0/dist/flatgeobuf.min.js"></script>

    <!-- Vite entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
